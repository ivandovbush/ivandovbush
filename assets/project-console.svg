<svg xmlns="http://www.w3.org/2000/svg" width="740" height="278" viewBox="0 0 740 278" role="img" aria-labelledby="t d">
  <title id="t">Autonomous systems build and deployment log</title>
  <desc id="d">A terminal log combining Ivan's personal underwater autonomy and multi-vehicle simulation projects with deployed vehicle infrastructure, navigation, embedded control, and sonar survey work at Ulysses.</desc>

  <style>
    /* Ayu Dark, as shipped in Ghostty */
    .m  { font-family: "JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; font-size: 14px }
    .fg { fill: #bfbdb6 } .dm { fill: #686868 } .gn { fill: #aad94c }
    .or { fill: #ffb454 } .bl { fill: #59c2ff } .cy { fill: #95e6cb }

    .line { opacity: 0; animation: in .01s linear forwards }
    .l1 { animation-delay: 1.45s } .l2 { animation-delay: 1.57s }
    .l3 { animation-delay: 1.69s } .l4 { animation-delay: 1.81s }
    .l5 { animation-delay: 1.93s } .l6 { animation-delay: 2.05s }
    .l7 { animation-delay: 2.20s } .l8 { animation-delay: 2.40s }

    .mask { animation: type 1.06s steps(48) .20s forwards }
    .k1 { opacity: 0; animation: in .01s linear .20s forwards, type 1.06s steps(48) .20s forwards,
                                 blink .9s steps(2) .20s infinite, out .01s linear 1.30s forwards }
    .k2 { opacity: 0; animation: in .01s linear 2.40s forwards, blink .9s steps(2) 2.40s infinite }
    .ping { opacity: 0; animation: in .01s linear 2.05s forwards, sweep 2.2s ease-in-out 2.1s infinite }

    @keyframes in    { to { opacity: 1 } }
    @keyframes out   { to { opacity: 0 } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes sweep { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    @keyframes type  { to { transform: translateX(403px) } }

    @media (prefers-reduced-motion: reduce) {
      .line, .ping { opacity: 1; animation: none }
      .mask { transform: translateX(403px); animation: none }
      .k1 { opacity: 0; animation: none }
      .k2 { opacity: 1; animation: none }
    }
  </style>

  <rect width="740" height="278" rx="10" fill="#0b0e14"/>
  <rect width="740" height="34" rx="10" fill="#11151c"/>
  <rect y="24" width="740" height="10" fill="#11151c"/>
  <text class="m dm" x="370" y="22" text-anchor="middle" style="font-size:12px">ivan@lab: ~/autonomy</text>

  <text class="m" x="20" y="64" xml:space="preserve"><tspan class="bl">$</tspan> <tspan class="gn">./portfolio</tspan><tspan class="fg"> build --target personal, ulysses</tspan></text>
  <rect class="mask" x="36" y="50" width="430" height="19" fill="#0b0e14"/>
  <rect class="k1" x="36" y="51" width="8" height="17" fill="#e6b450"/>

  <text class="m line l1" x="20" y="92"  xml:space="preserve"><tspan class="gn">[ OK ]</tspan> <tspan class="fg">auv_ws built · </tspan><tspan class="or">ROS 2 + Gazebo</tspan><tspan class="fg"> autonomy workspace ready</tspan></text>
  <text class="m line l2" x="20" y="114" xml:space="preserve"><tspan class="dm">[INFO] [micro_subs] </tspan><tspan class="or">multi-vehicle</tspan><tspan class="fg"> world · ArUco pose pipeline online</tspan></text>
  <text class="m line l3" x="20" y="136" xml:space="preserve"><tspan class="gn">[ OK ]</tspan> <tspan class="fg">jetson flashed · docker workspace up · </tspan><tspan class="or">95%</tspan><tspan class="fg"> faster</tspan></text>
  <text class="m line l4" x="20" y="158" xml:space="preserve"><tspan class="dm">[INFO] [navigation] </tspan><tspan class="fg">DVL + INS over NATS · GPS-denied dead reckoning</tspan></text>
  <text class="m line l5" x="20" y="180" xml:space="preserve"><tspan class="dm">[INFO] [buoyancy]  </tspan><tspan class="or">STM32 + CAN</tspan><tspan class="fg"> solenoid control · holding depth ±0.3 m</tspan></text>
  <text class="m line l6" x="20" y="202" xml:space="preserve"><tspan class="dm">[INFO] [sonar]     </tspan><tspan class="fg">SDS → XTF · </tspan><tspan class="or">1,412</tspan><tspan class="fg"> pings georeferenced  </tspan><tspan class="cy ping">▁▃▅▇▅▃▁</tspan></text>
  <text class="m line l7" x="20" y="228" xml:space="preserve"><tspan class="gn">[ OK ]</tspan> <tspan class="fg">field survey complete · </tspan><tspan class="or">0</tspan><tspan class="fg"> interventions</tspan></text>

  <text class="m line l8 bl" x="20" y="256">$</text>
  <rect class="k2" x="36" y="243" width="8" height="17" fill="#e6b450"/>
</svg>
